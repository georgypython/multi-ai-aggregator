services:
  postgres:
    image: postgres:16.4-alpine
    container_name: app-db
    networks:
      - ai-app-net
    ports:
      - "${APP_CONFIG__DB__PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${APP_CONFIG__DB__USER:-postgres}"
      POSTGRES_PASSWORD: "${APP_CONFIG__DB__PASSWD:-postgres}"
      POSTGRES_DB: "${APP_CONFIG__DB__NAME:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_CONFIG__DB__USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: app-redis
    networks:
      - ai-app-net
    command:
      - redis-server
      - --requirepass
      - ${APP_CONFIG__REDIS__PASSWORD:-change-me-redis-password}
    ports:
      - "${APP_CONFIG__REDIS__PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${APP_CONFIG__REDIS__PASSWORD:-change-me-redis-password}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: app-minio
    networks:
      - ai-app-net
    command: server /data --console-address ":9001"
    ports:
      - "${APP_CONFIG__STORAGE__PORT:-9000}:9000"
      - "${APP_CONFIG__STORAGE__CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${APP_CONFIG__STORAGE__ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${APP_CONFIG__STORAGE__SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: app-minio-init
    networks:
      - ai-app-net
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: "${APP_CONFIG__STORAGE__ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${APP_CONFIG__STORAGE__SECRET_KEY:-minioadmin}"
      STORAGE_BUCKET: "${APP_CONFIG__STORAGE__BUCKET:-ai-media}"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done &&
      mc mb -p local/\"$${STORAGE_BUCKET}\" || true &&
      mc anonymous set none local/\"$${STORAGE_BUCKET}\" || true
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: app-backend
    networks:
      - ai-app-net
    env_file:
      - .env
    command:
      - sh
      - -c
      - alembic -c /app/backend/alembic.ini upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${APP_CONFIG__RUN__PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: app-bot
    networks:
      - ai-app-net
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  ai-app-net:
    external: true
    name: ai-app-net
