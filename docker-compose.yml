services:
  postgres:
    image: postgres:16.4-alpine
    container_name: app-db
    ports:
      - "${APP_CONFIG__DB__PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${APP_CONFIG__DB__USER:-postgres}"
      POSTGRES_PASSWORD: "${APP_CONFIG__DB__PASSWD:-postgres}"
      POSTGRES_DB: "${APP_CONFIG__DB__NAME:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_CONFIG__DB__USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: app-redis
    ports:
      - "${APP_CONFIG__REDIS__PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: app-rabbitmq
    ports:
      - "${APP_CONFIG__RABBITMQ__PORT:-5672}:5672"
      - "${APP_CONFIG__RABBITMQ__MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${APP_CONFIG__RABBITMQ__USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${APP_CONFIG__RABBITMQ__PASS:-guest}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: app-minio
    command: server /data --console-address ":9001"
    ports:
      - "${APP_CONFIG__STORAGE__PORT:-9000}:9000"
      - "${APP_CONFIG__STORAGE__CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${APP_CONFIG__STORAGE__ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${APP_CONFIG__STORAGE__SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: app-minio-init
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: "${APP_CONFIG__STORAGE__ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${APP_CONFIG__STORAGE__SECRET_KEY:-minioadmin}"
      STORAGE_BUCKET: "${APP_CONFIG__STORAGE__BUCKET:-ai-media}"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done &&
      mc mb -p local/\"$${STORAGE_BUCKET}\" || true &&
      mc anonymous set none local/\"$${STORAGE_BUCKET}\" || true
      "

  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile.taskiq-worker
    container_name: app-taskiq-worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
