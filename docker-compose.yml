services:
  postgres:
    image: postgres:16.4-alpine
    container_name: app-db
    networks:
      - ai-app-net
    ports:
      - "${DB__PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${DB__USER:-postgres}"
      POSTGRES_PASSWORD: "${DB__PASSWD:-postgres}"
      POSTGRES_DB: "${DB__NAME:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB__USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: app-redis
    networks:
      - ai-app-net
    command:
      - redis-server
      - --requirepass
      - ${REDIS__PASSWORD:-change-me-redis-password}
    ports:
      - "${REDIS__PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS__PASSWORD:-change-me-redis-password}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: app-minio
    networks:
      - ai-app-net
    command: server /data --console-address ":9001"
    ports:
      - "${STORAGE__PORT:-9000}:9000"
      - "${STORAGE__CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${STORAGE__ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${STORAGE__SECRET_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: app-minio-init
    networks:
      - ai-app-net
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: "${STORAGE__ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${STORAGE__SECRET_KEY:-minioadmin}"
      STORAGE_BUCKET: "${STORAGE__BUCKET:-ai-media}"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        echo 'Waiting for MinIO to be ready...';
        sleep 2;
      done &&
      mc mb -p local/\"$${STORAGE_BUCKET}\" || true &&
      mc anonymous set none local/\"$${STORAGE_BUCKET}\" || true
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: app-backend
    networks:
      - ai-app-net
    env_file:
      - .env
    command:
      - sh
      - -c
      - alembic -c /app/backend/alembic.ini upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${RUN__PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_STAND: ${VITE_STAND}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_INIT_DATA: ${VITE_INIT_DATA}
    container_name: app-frontend
    networks:
      - ai-app-net
    ports:
      - "${FRONTEND__PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: app-bot
    networks:
      - ai-app-net
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: app-rabbitmq
    ports:
      - "${RABBITMQ__PORT:-5672}:5672"
      - "${RABBITMQ__MGMT_PORT:-15672}:15672"
    networks:
      - ai-app-net
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ__USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ__PASSWORD:-guest}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      start_period: 60s
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    mem_limit: 1g
    restart: unless-stopped

  taskiq-worker:
    build:
      context: .
      dockerfile: Dockerfile.taskiq-worker
    container_name: app-taskiq-worker
    networks:
      - ai-app-net
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:

networks:
  ai-app-net:
    external: true
    name: ai-app-net
